<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Quiz Showdown</title>
  <desc id="desc">Quiz Showdown logo and name on a dark dotted stage lit coral and sky blue, with a small game board, a lime highlighted tile, and two team scores.</desc>
  <defs>
    <radialGradient id="coral" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 0) scale(620 300)">
      <stop offset="0" stop-color="#f8735a" stop-opacity=".30"/>
      <stop offset="1" stop-color="#f8735a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sky" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1200 0) scale(620 300)">
      <stop offset="0" stop-color="#4cb4f9" stop-opacity=".30"/>
      <stop offset="1" stop-color="#4cb4f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#8b8ba8" fill-opacity=".14"/>
    </pattern>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c2b"/>
      <stop offset="1" stop-color="#121220"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".55"/>
    </filter>
    <filter id="limeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#d4ff2e" flood-opacity=".45"/>
    </filter>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="1199" height="339" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="#0a0a14"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#coral)"/>
    <rect width="1200" height="340" fill="url(#sky)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#25253a"/>

  <!-- Logo tile -->
  <g transform="translate(96 106)">
    <rect width="128" height="128" rx="30" fill="#d4ff2e"/>
    <text x="64" y="91" text-anchor="middle" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-weight="900" font-size="72" fill="#0a0a14">Q</text>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="267" y="134" font-size="14" font-weight="700" letter-spacing="2.5" fill="#d4ff2e">CLASSROOM · GAME SHOW</text>
    <text x="264" y="190" font-size="60" font-weight="800" letter-spacing="-1.8" fill="#f7f4ee">Quiz Showdown</text>
    <text x="267" y="230" font-size="20" fill="#9d9db4">Two teams, one board. Pick a tile, beat the clock,</text>
    <text x="267" y="256" font-size="20" fill="#9d9db4">reveal the answer, and award the points.</text>
  </g>

  <!-- Mini board -->
  <g transform="translate(792 50)" filter="url(#shadow)">
    <rect width="320" height="240" rx="18" fill="#10101c" stroke="#25253a"/>
    <g font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle">
      <!-- scores -->
      <rect x="16" y="16" width="124" height="46" rx="10" fill="#141422" stroke="#f8735a" stroke-opacity=".8" stroke-width="2"/>
      <rect x="16" y="16" width="124" height="4" rx="2" fill="#f8735a"/>
      <text x="78" y="49" font-size="22" fill="#f8735a">1500</text>
      <text x="160" y="46" font-size="14" fill="#6e6e86">VS</text>
      <rect x="180" y="16" width="124" height="46" rx="10" fill="#141422" stroke="#25253a" stroke-width="2"/>
      <rect x="180" y="16" width="124" height="4" rx="2" fill="#4cb4f9"/>
      <text x="242" y="49" font-size="22" fill="#f7f4ee">600</text>
      <!-- tiles -->
      <g font-size="20" fill="#f7f4ee">
        <rect x="16" y="76" width="92" height="46" rx="9" fill="url(#tile)" stroke="#25253a"/><text x="62" y="106">100</text>
        <rect x="114" y="76" width="92" height="46" rx="9" fill="none" stroke="#25253a" stroke-dasharray="4 4"/>
        <rect x="212" y="76" width="92" height="46" rx="9" fill="url(#tile)" stroke="#25253a"/><text x="258" y="106">100</text>
        <rect x="16" y="128" width="92" height="46" rx="9" fill="url(#tile)" stroke="#25253a"/><text x="62" y="158">500</text>
        <g filter="url(#limeGlow)"><rect x="114" y="128" width="92" height="46" rx="9" fill="#d4ff2e"/></g><text x="160" y="158" fill="#0a0a14">500</text>
        <rect x="212" y="128" width="92" height="46" rx="9" fill="none" stroke="#25253a" stroke-dasharray="4 4"/>
        <rect x="16" y="180" width="92" height="46" rx="9" fill="url(#tile)" stroke="#25253a"/><text x="62" y="210">1000</text>
        <rect x="114" y="180" width="92" height="46" rx="9" fill="url(#tile)" stroke="#25253a"/><text x="160" y="210">1000</text>
        <rect x="212" y="180" width="92" height="46" rx="9" fill="url(#tile)" stroke="#25253a"/><text x="258" y="210">1000</text>
      </g>
    </g>
  </g>
  <!-- timer ring -->
  <g transform="translate(1152 170)">
    <circle r="26" fill="#10101c" stroke="#25253a" stroke-width="2"/>
    <circle r="20" fill="none" stroke="#25253a" stroke-width="4"/>
    <circle r="20" fill="none" stroke="#d4ff2e" stroke-width="4" stroke-linecap="round" stroke-dasharray="125.66" stroke-dashoffset="37" transform="rotate(-90)"/>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" fill="#f7f4ee">15</text>
  </g>
</svg>
