<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Quiz Showdown</title>
  <desc id="desc">Quiz Showdown logo and name on a deep blue stage gradient, with a small game board of gold point values and two team scores.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1d4a"/>
      <stop offset="1" stop-color="#050c24"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#1b3f9c" stop-opacity=".75"/>
      <stop offset="1" stop-color="#1b3f9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#1440b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="1199" height="339" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <ellipse cx="880" cy="0" rx="420" ry="300" fill="url(#spot)"/>
    <circle cx="120" cy="380" r="170" fill="#0f2765" opacity=".6"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="none" stroke="#1f3a7a"/>

  <!-- Logo tile -->
  <g transform="translate(96 106)">
    <rect width="128" height="128" rx="28" fill="#1440b8"/>
    <rect x="7" y="7" width="114" height="114" rx="22" fill="none" stroke="#ffc800" stroke-width="5"/>
    <text x="64" y="92" text-anchor="middle" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="72" fill="#ffc800">Q</text>
  </g>

  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="267" y="134" font-size="14" font-weight="700" letter-spacing="2.5" fill="#5cc8ff">CLASSROOM · GAME SHOW</text>
    <text x="264" y="190" font-size="60" font-weight="800" letter-spacing="-1.2" fill="#fff8e6">Quiz <tspan fill="#ffc800" filter="url(#glow)">Showdown</tspan></text>
    <text x="267" y="230" font-size="20" fill="#9fb2d9">Two teams, one board. Pick a tile, beat the clock,</text>
    <text x="267" y="256" font-size="20" fill="#9fb2d9">reveal the answer, and award the points.</text>
  </g>

  <!-- Mini board -->
  <g transform="translate(792 54)" filter="url(#shadow)">
    <rect width="320" height="232" rx="18" fill="#08142f" stroke="#1f3a7a"/>
    <g font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle">
      <!-- scores -->
      <rect x="16" y="14" width="124" height="44" rx="10" fill="#0f2457" stroke="#2563eb" stroke-width="2"/>
      <text x="78" y="44" font-size="22" fill="#5b8cff">1500</text>
      <text x="160" y="44" font-size="18" fill="#ffc800">VS</text>
      <rect x="180" y="14" width="124" height="44" rx="10" fill="#0f2457" stroke="#22345f" stroke-width="2"/>
      <text x="242" y="44" font-size="22" fill="#fff8e6">600</text>
      <!-- tiles: 3 columns x 3 rows -->
      <g font-size="20" fill="#ffc800">
        <rect x="16" y="72" width="92" height="44" rx="8" fill="url(#tile)"/><text x="62" y="101">100</text>
        <rect x="114" y="72" width="92" height="44" rx="8" fill="#14224a"/>
        <rect x="212" y="72" width="92" height="44" rx="8" fill="url(#tile)"/><text x="258" y="101">100</text>
        <rect x="16" y="124" width="92" height="44" rx="8" fill="url(#tile)"/><text x="62" y="153">500</text>
        <rect x="114" y="124" width="92" height="44" rx="8" fill="url(#tile)" stroke="#ffc800" stroke-width="3"/><text x="160" y="153">500</text>
        <rect x="212" y="124" width="92" height="44" rx="8" fill="#14224a"/>
        <rect x="16" y="176" width="92" height="44" rx="8" fill="url(#tile)"/><text x="62" y="205">1000</text>
        <rect x="114" y="176" width="92" height="44" rx="8" fill="url(#tile)"/><text x="160" y="205">1000</text>
        <rect x="212" y="176" width="92" height="44" rx="8" fill="url(#tile)"/><text x="258" y="205">1000</text>
      </g>
    </g>
  </g>
  <!-- timer badge -->
  <g transform="translate(1072 34)" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif">
    <rect width="76" height="40" rx="20" fill="#ffc800"/>
    <circle cx="22" cy="20" r="9" fill="none" stroke="#0a1633" stroke-width="2.6"/>
    <path d="M22 14v6l4 3" fill="none" stroke="#0a1633" stroke-width="2.6" stroke-linecap="round"/>
    <text x="52" y="27" text-anchor="middle" font-size="18" font-weight="800" fill="#0a1633">20</text>
  </g>
</svg>
