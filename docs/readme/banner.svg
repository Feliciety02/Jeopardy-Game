<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Quiz Showdown</title>
  <desc id="desc">The Quiz Showdown logo, a Q whose bowl is a countdown ring and whose tail is a lit board tile, beside a minimal quiz board with a category row and 100, 500 and 1000 point tiles.</desc>
  <defs>
    <clipPath id="frame"><rect x="0.5" y="0.5" width="1199" height="339" rx="24"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="339" rx="24" fill="#0a0a14" stroke="#22223a"/>

  <!-- Logo mark -->
  <g transform="translate(88 110)">
    <circle cx="58" cy="58" r="31" fill="none" stroke="#f7f4ee" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="158 36.8" transform="rotate(76 58 58)"/>
    <rect x="76" y="76" width="30" height="30" rx="8" fill="#d4ff2e"/>
  </g>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif">
    <text x="226" y="178" font-size="54" font-weight="800" letter-spacing="-1.6" fill="#f7f4ee">Quiz Showdown</text>
    <text x="229" y="214" font-size="19" fill="#8a8aa3">A two-team quiz board for the classroom.</text>
  </g>

  <!-- Board: category row + three value rows -->
  <g transform="translate(704 66)" font-family="'Segoe UI', system-ui, Helvetica, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <!-- category row -->
    <g fill="#3a3a55">
      <rect x="20" y="10" width="36" height="6" rx="3"/>
      <rect x="104" y="10" width="44" height="6" rx="3"/>
      <rect x="194" y="10" width="32" height="6" rx="3"/>
      <rect x="274" y="10" width="40" height="6" rx="3"/>
      <rect x="360" y="10" width="36" height="6" rx="3"/>
    </g>
    <line x1="0" y1="34" x2="416" y2="34" stroke="#22223a" stroke-width="2"/>

    <!-- tiles: 5 columns x 3 rows, 76 wide, 8 gap -->
    <g font-size="19" fill="#f7f4ee">
      <!-- 100 -->
      <rect x="0"   y="48" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="38"  y="81">100</text>
      <rect x="84"  y="48" width="76" height="52" rx="10" fill="none" stroke="#22223a" stroke-dasharray="4 4"/>
      <rect x="168" y="48" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="206" y="81">100</text>
      <rect x="252" y="48" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="290" y="81">100</text>
      <rect x="336" y="48" width="76" height="52" rx="10" fill="none" stroke="#22223a" stroke-dasharray="4 4"/>
      <!-- 500 -->
      <rect x="0"   y="108" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="38"  y="141">500</text>
      <rect x="84"  y="108" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="122" y="141">500</text>
      <rect x="168" y="108" width="76" height="52" rx="10" fill="#d4ff2e"/><text x="206" y="141" fill="#0a0a14">500</text>
      <rect x="252" y="108" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="290" y="141">500</text>
      <rect x="336" y="108" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="374" y="141">500</text>
      <!-- 1000 -->
      <rect x="0"   y="168" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="38"  y="201">1000</text>
      <rect x="84"  y="168" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="122" y="201">1000</text>
      <rect x="168" y="168" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="206" y="201">1000</text>
      <rect x="252" y="168" width="76" height="52" rx="10" fill="none" stroke="#22223a" stroke-dasharray="4 4"/>
      <rect x="336" y="168" width="76" height="52" rx="10" fill="#15151f" stroke="#22223a"/><text x="374" y="201">1000</text>
    </g>
  </g>
</svg>
